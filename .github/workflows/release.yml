name: release

# On a version tag, the images the demo runs (infra/compose.cloud.yaml, ADR 0010): built, scanned
# for known vulnerabilities, and pushed to GHCR as
# ghcr.io/<owner>/lecture-summariser-{api,worker,web}:<tag>.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Every action is pinned to a full commit SHA, as in ci.yml.

jobs:
  images:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            file: infra/docker/api.Dockerfile
            build-args: ""
          # With Modal's client: speech recognition and indexing embeddings run on GPUs there.
          - name: worker
            file: infra/docker/worker.Dockerfile
            build-args: |
              EXTRA=modal
          # Calls the API at its own origin (Caddy routes /v1 to it). The Clerk publishable key
          # is public by design: a repository variable, not a secret. Unset, sign-in is off.
          - name: web
            file: infra/docker/web.Dockerfile
            build-args: |
              NEXT_PUBLIC_API_URL=
              NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.CLERK_PUBLISHABLE_KEY }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/lecture-summariser-${{ matrix.name }}:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          cache-from: |
            type=gha,scope=${{ matrix.name }}
            type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
      # Fails on high or critical vulnerabilities that have a fix to update to.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE"
