name: eval

# The eval gate (Phase 4c): the stack in Docker on GitHub's runner, MIT 6.0001 Lecture 10 processed
# through the API, and every suite scored against evals/thresholds.json. There's no GPU here, so
# speech recognition runs on the CPU and search without the reranker (infra/compose.eval.yaml).
# The stage cache is kept between runs, so only the stages whose inputs changed run again: the
# first run transcribes the lecture on the CPU, later ones take minutes. LLM calls use the
# GEMINI_API_KEY repository secret (Gemini's free tier; the lecture is openly licensed).
#
# Actions are pinned to commit SHAs, as in ci.yml.

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/api/**"
      - "packages/**"
      - "prompts/**"
      - "evals/**"
      - "infra/compose.yaml"
      - "infra/compose.eval.yaml"
      - "infra/docker/api.Dockerfile"
      - "infra/docker/worker.Dockerfile"
      - "uv.lock"
      - ".github/workflows/eval.yml"
  pull_request:
    paths: *paths
  schedule:
    - cron: "23 4 * * 1"  # Mondays: catches drift in the hosted LLM
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSE: docker compose -f infra/compose.yaml -f infra/compose.eval.yaml --profile app
  # SeaweedFS's dev-only credentials (infra/seaweedfs/s3.json), to sync the stage cache.
  AWS_ACCESS_KEY_ID: lecture-dev
  AWS_SECRET_ACCESS_KEY: lecture-dev-secret
  AWS_DEFAULT_REGION: us-east-1
  S3_ENDPOINT: http://localhost:8333

jobs:
  eval:
    name: Eval gate
    # Pull requests from forks don't get the secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash  # -eo pipefail, so a failing gate isn't hidden by tee
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check for the Gemini key
        if: env.GEMINI_API_KEY == ''
        run: |
          echo "::error::The eval gate needs a GEMINI_API_KEY repository secret (Settings > Secrets and variables > Actions)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Make room
        # SDKs the runner ships with and this job doesn't use; images and models need the space.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - run: uv sync --locked

      - name: Restore the speech model
        id: whisper
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/models/faster-whisper-large-v3-turbo
          key: faster-whisper-large-v3-turbo-0a363e9
      - name: Download the speech model
        if: steps.whisper.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/models/faster-whisper-large-v3-turbo
          cd data/models/faster-whisper-large-v3-turbo
          for f in config.json preprocessor_config.json tokenizer.json vocabulary.json model.bin; do
            curl -fsSL --retry 3 -O "https://huggingface.co/mobiuslabsgmbh/faster-whisper-large-v3-turbo/resolve/0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf/$f"
          done
          echo "e76620f83d5f5b69efd3d87e3dc180c1bd21df9fbebacfd4335e5e1efcc018da  model.bin" | sha256sum -c
      - if: steps.whisper.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/models/faster-whisper-large-v3-turbo
          key: ${{ steps.whisper.outputs.cache-primary-key }}
      - name: Restore the lecture's media
        id: media
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/lectures
          key: eval-media-${{ hashFiles('evals/datasets/**/*.json') }}
      - name: Restore the embedding model
        id: tei
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eval/tei
          key: tei-qwen3-embedding-0.6b-97b0c61
      - name: Restore the stage cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eval/stage-cache
          key: eval-stage-cache-${{ github.run_id }}
          restore-keys: eval-stage-cache-

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          tags: lecture-summariser/api:dev
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      # The worker with speech recognition on the CPU (faster-whisper without CUDA).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          build-args: EXTRA=asr
          tags: lecture-summariser/worker:asr
          load: true
          cache-from: type=gha,scope=worker-asr
          cache-to: type=gha,mode=max,scope=worker-asr

      - name: Start the stack
        run: |
          mkdir -p .eval/tei .eval/stage-cache data/lectures
          $COMPOSE up -d --no-build api cpu-worker
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/readyz && break; sleep 5; done
          curl -fsS http://localhost:8000/readyz
      - name: Hand the embedding model's files to the runner
        if: steps.tei.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" .eval/tei
      - if: steps.tei.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eval/tei
          key: ${{ steps.tei.outputs.cache-primary-key }}
      - name: Load the stage cache into storage
        run: |
          aws configure set default.s3.addressing_style path  # SeaweedFS, not AWS
          aws s3 sync .eval/stage-cache s3://lectures/artifacts --endpoint-url "$S3_ENDPOINT" --only-show-errors

      - name: Process Lecture 10 and run the gate
        run: uv run lecture-eval --prepare --gate --modes dense,bm25,hybrid --pause 2 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the stage cache
        if: always()
        continue-on-error: true
        run: aws s3 sync s3://lectures/artifacts .eval/stage-cache --endpoint-url "$S3_ENDPOINT" --only-show-errors
      - if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eval/stage-cache
          key: eval-stage-cache-${{ github.run_id }}
      - if: always() && steps.media.outputs.cache-hit != 'true' && hashFiles('data/lectures/*.mp4') != ''
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/lectures
          key: ${{ steps.media.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-reports
          path: data/evals
          if-no-files-found: ignore
      - name: Service logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 300 api cpu-worker embeddings
