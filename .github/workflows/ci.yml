name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA, because tags can be moved (the Trivy compromise
# in March 2026 did exactly that). When updating one, change the SHA and the version comment
# together. The uv version matches infra/docker/api.Dockerfile.

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      # Integration tests start Postgres and SeaweedFS with testcontainers. CI=true makes them
      # fail rather than skip if Docker is unavailable.
      - run: uv run pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      # Every workspace package with every extra: the GPU image ships faster-whisper and CUDA.
      - run: uv export --locked --all-packages --all-extras --no-emit-workspace --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
      - run: uv run --locked pip-audit --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"

  web:
    name: Web app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          package_json_file: apps/web/package.json
          cache: true
          cache_dependency_path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The typed client must match the committed OpenAPI schema (itself checked against the
      # API by tests/unit/test_openapi_snapshot.py).
      - run: pnpm run gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm audit --audit-level high

  image:
    name: Build images
    needs: [lint, test, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only: release.yml scans the demo's images and pushes them to GHCR on a version tag.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # The CPU variant of the worker image. The GPU variant adds 1.4 GB of CUDA wheels from
      # the same Dockerfile, so it isn't built here.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
