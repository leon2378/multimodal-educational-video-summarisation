[project]
name = "lecture-evals"
version = "0.1.0"
description = "Baselines and evaluation suites that score pipeline outputs."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.25",
    "httpx>=0.28",
    "jiwer>=4",
    "lecture-core",
    "lecture-llm",
    "pydantic-ai-slim[google]>=2.51",
    "pypdf>=6.19",
]

[project.scripts]
gemini-baseline = "lecture_evals.baselines.gemini:main"
lecture-eval = "lecture_evals.cli:main"

[tool.uv.sources]
lecture-core = { workspace = true }
lecture-llm = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
