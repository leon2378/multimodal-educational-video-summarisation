# Grype's settings for release.yml's image scan, which fails on high or critical vulnerabilities
# that have a fix. Each exception says why it's safe and when it goes.
ignore:
  # CVE-2026-82049: CPython's tarfile extraction filters and a crafted archive (a hard link to a
  # symlink). A false positive: the CVE record (from the PSF) has 3.12.15 fixed, as it affects
  # versions before it, but Grype's data lists only the fix in 3.14.0b1. The app never extracts
  # tar archives anyway. Scoped to 3.12.15, so a newer Python gets looked at again.
  - vulnerability: CVE-2026-82049
    package:
      name: python
      version: 3.12.15
      type: binary

  # The worker's FFmpeg, in PyAV's wheel: CVE-2026-70632 (the CineForm decoder) and
  # CVE-2026-70628 (the DVB subtitle parser, through a WTV file) are fixed in FFmpeg 9. PyAV 19
  # bundles it, but faster-whisper 1.2.1 passes av.open an argument PyAV 19 removed. Neither is
  # reachable from an upload: lecture_perception.media has FFmpeg open only MP4/MOV, Matroska and
  # WebM files and start only the decoders lectures use (tests/unit/test_perception.py). Scoped
  # to FFmpeg 8.1.2: move to PyAV 19 with faster-whisper's next release, and delete these.
  - vulnerability: CVE-2026-70632
    package:
      name: ffmpeg
      version: 8.1.2
      location: "/app/.venv/lib/python3.12/site-packages/av.libs/**"
  - vulnerability: CVE-2026-70628
    package:
      name: ffmpeg
      version: 8.1.2
      location: "/app/.venv/lib/python3.12/site-packages/av.libs/**"

  # The FFmpeg in OpenCV's wheel, which is there for cv2.VideoCapture. Nothing calls it: videos
  # are decoded with PyAV, and RapidOCR uses OpenCV only on images. Delete this if anything
  # starts reading video through OpenCV.
  - package:
      name: ffmpeg
      location: "/app/.venv/lib/python3.12/site-packages/opencv_python_headless.libs/**"
