[project]
name = "lecture-rag"
version = "0.1.0"
description = "Retrieval over lecture timelines: chunking, hybrid search (dense and BM25) and reranking."
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.1",
    "httpx>=0.28",
    "lecture-core",
    "qdrant-client>=1.19.1",
]

[tool.uv.sources]
lecture-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
