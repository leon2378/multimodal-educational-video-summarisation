[project]
name = "lecture-perception"
version = "0.1.0"
description = "Media decoding, slide-change detection, OCR, and speech recognition adapters."
requires-python = ">=3.12"
dependencies = [
    "av>=18.1",
    "lecture-core",
    "numpy>=2.5",
    # OpenCV without its GUI: rapidocr asks for opencv-python, dropped in the root pyproject.
    "opencv-python-headless>=5.0",
    "pillow>=12.3",
    "rapidocr>=3.9.2",
]

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.2.1",
]
# CUDA 12 libraries that CTranslate2 loads at runtime (Linux only: the GPU worker image).
cuda = [
    "nvidia-cublas-cu12>=12.9 ; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.26,<10 ; sys_platform == 'linux'",
]
# Modal's client, for speech recognition on a GPU in Modal (infra/modal/asr.py) from a host
# without one.
modal = [
    "modal>=1.5.5",
]

[tool.uv.sources]
lecture-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
