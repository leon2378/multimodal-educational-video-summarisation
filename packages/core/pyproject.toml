[project]
name = "lecture-core"
version = "0.1.0"
description = "Domain models, settings, and database and storage clients shared by the API and workers."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.31",
    "boto3>=1.43",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
