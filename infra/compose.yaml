# Local stack. `make up` starts the backing services; `make app` adds the API and CPU worker in
# containers, `make gpu-worker` the GPU worker. Ports bind to 127.0.0.1 only. Credentials here
# are dev-only defaults (see .env.example).
name: lecture-summariser

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://lecture:lecture@postgres:5432/lecture
  S3_ENDPOINT_URL: http://seaweedfs:8333
  # Presigned URLs must name a host your browser or curl can reach, not the Compose service.
  S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
  TEMPORAL_ADDRESS: temporal:7233

x-api: &api
  build:
    context: ..
    dockerfile: infra/docker/api.Dockerfile
  image: lecture-summariser/api:dev
  profiles: [app]
  environment: *app-env

x-worker: &worker
  env_file:
    - path: ../.env
      required: false
  environment: *app-env
  depends_on:
    postgres:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy
    temporal:
      condition: service_healthy

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lecture
      POSTGRES_PASSWORD: lecture
      POSTGRES_DB: lecture
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture -d lecture"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # `mini` runs master, volume, filer and S3 gateway in one process and creates the bucket.
    command: mini -bucket=lectures -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"  # S3 API
      - "127.0.0.1:8888:8888"  # filer UI, for browsing stored files
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Temporal dev server: workflow history in SQLite, web UI on http://localhost:8233.
  temporal:
    image: temporalio/temporal:1.9.1
    # The image runs as user "temporal", which owns /home/temporal; a new named volume mounted
    # there takes that ownership, so the server can write its SQLite file.
    command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"  # gRPC, for the API and workers
      - "127.0.0.1:8233:8233"  # web UI
    volumes:
      - temporal-home:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "default", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

  migrate:
    <<: *api
    command: ["alembic", "-c", "packages/core/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The web app on http://localhost:3000. It calls the API from the browser, at the address
  # baked in at build time.
  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: lecture-summariser/web:dev
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Serves the cpu and llm queues: media, slides, timeline, LLM calls, saving results.
  cpu-worker:
    <<: *worker
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    image: lecture-summariser/worker:cpu
    command: ["lecture-worker", "--queues", "cpu,llm"]

  # Serves the gpu queue: speech recognition, one lecture at a time.
  gpu-worker:
    <<: *worker
    profiles: [gpu]
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        EXTRA: gpu
    image: lecture-summariser/worker:gpu
    command: ["lecture-worker", "--queues", "gpu"]
    environment:
      <<: *app-env
      WHISPER_DEVICE: cuda
      WHISPER_MODEL_PATH: /app/data/models/faster-whisper-large-v3-turbo
    volumes:
      - ../data/models:/app/data/models:ro
    deploy: *gpu

  # One-off local runs without Temporal: `make process video=... title=...`.
  pipeline:
    profiles: [gpu]
    image: lecture-summariser/worker:gpu
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        EXTRA: gpu
    entrypoint: ["lecture-process"]
    # Your host user, so files written to data/ stay yours (set by the Makefile).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - path: ../.env
        required: false
    environment:
      WHISPER_DEVICE: cuda
    volumes:
      - ../data:/app/data
      - ../prompts:/app/prompts:ro
    deploy: *gpu

volumes:
  postgres-data:
  seaweedfs-data:
  temporal-home:
