# Local stack. `make up` starts the backing services; `make app` adds the API, web app and CPU
# worker in containers, `make gpu-worker` the GPU services (speech recognition and the
# reranker). Ports bind to 127.0.0.1 only. Credentials here are dev-only defaults (see
# .env.example).
name: lecture-summariser

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://lecture:lecture@postgres:5432/lecture
  S3_ENDPOINT_URL: http://seaweedfs:8333
  # Presigned URLs must name a host your browser or curl can reach, not the Compose service.
  S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
  TEMPORAL_ADDRESS: temporal:7233
  QDRANT_URL: http://qdrant:6333
  EMBEDDINGS_URL: http://embeddings:80
  RERANKER_URL: http://reranker:80
  # The reranker runs on the GPU here, so searches use it by default.
  SEARCH_MODE: rerank

x-api: &api
  build:
    context: ..
    dockerfile: infra/docker/api.Dockerfile
  image: lecture-summariser/api:dev
  profiles: [app]
  # GEMINI_API_KEY for Q&A.
  env_file:
    - path: ../.env
      required: false
  environment: *app-env

x-worker: &worker
  env_file:
    - path: ../.env
      required: false
  environment: *app-env
  depends_on:
    postgres:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy
    temporal:
      condition: service_healthy

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lecture
      POSTGRES_PASSWORD: lecture
      POSTGRES_DB: lecture
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture -d lecture"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # `mini` runs master, volume, filer and S3 gateway in one process and creates the bucket.
    command: mini -bucket=lectures -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"  # S3 API
      - "127.0.0.1:8888:8888"  # filer UI, for browsing stored files
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Temporal dev server: workflow history in SQLite, web UI on http://localhost:8233.
  temporal:
    image: temporalio/temporal:1.9.1
    # The image runs as user "temporal", which owns /home/temporal; a new named volume mounted
    # there takes that ownership, so the server can write its SQLite file.
    command: server start-dev --ip 0.0.0.0 --db-filename /home/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233"  # gRPC, for the API and workers
      - "127.0.0.1:8233:8233"  # web UI
    volumes:
      - temporal-home:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "default", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

  # Vector search: dense and BM25 vectors per timeline segment. Dashboard on
  # http://localhost:6333/dashboard.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"  # HTTP
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Hugging Face Text Embeddings Inference. Models are pinned to a revision and downloaded into
  # tei-data on first start. --max-batch-tokens also caps the longest input (longer ones are
  # truncated); chunks are under 1,000 tokens.
  #
  # Embeddings run on the CPU here; with a GPU, infra/compose.gpu.yaml moves them onto it (ADR
  # 0008). The CPU backend has no flash attention, so memory grows with the square of the batch:
  # the 16384 default runs out of memory while warming up.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    command: ["--model-id", "Qwen/Qwen3-Embedding-0.6B", "--revision", "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3", "--max-batch-tokens", "4096"]
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - tei-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 120  # the first start downloads the model

  # The reranker runs on the GPU: on a laptop CPU it took 77 s to rerank 30 passages (ADR 0005).
  # It holds about 1.5 GB of VRAM next to speech recognition's 2.3 GB peak. This image is for
  # RTX 30-series cards (compute capability 8.6); other GPUs need the matching tag from the TEI
  # README, or cpu-1.9.4 with SEARCH_MODE=hybrid.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:86-1.9.4
    profiles: [gpu]
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--revision", "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e", "--max-batch-tokens", "4096"]
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - tei-data:/data
    deploy: *gpu
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 120

  migrate:
    <<: *api
    command: ["alembic", "-c", "packages/core/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The web app on http://localhost:3000. It calls the API from the browser, at the address
  # baked in at build time.
  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: lecture-summariser/web:dev
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # Serves the cpu and llm queues: media, slides, timeline, LLM calls, saving results.
  cpu-worker:
    <<: *worker
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    image: lecture-summariser/worker:cpu
    command: ["lecture-worker", "--queues", "cpu,llm"]
    # It also embeds and indexes lectures for search.
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      temporal:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy

  # Serves the gpu queue: speech recognition, one lecture at a time.
  gpu-worker:
    <<: *worker
    profiles: [gpu]
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        EXTRA: gpu
    image: lecture-summariser/worker:gpu
    command: ["lecture-worker", "--queues", "gpu"]
    environment:
      <<: *app-env
      WHISPER_DEVICE: cuda
      WHISPER_MODEL_PATH: /app/data/models/faster-whisper-large-v3-turbo
    volumes:
      - ../data/models:/app/data/models:ro
    deploy: *gpu

  # One-off local runs without Temporal: `make process video=... title=...`.
  pipeline:
    profiles: [gpu]
    image: lecture-summariser/worker:gpu
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
      args:
        EXTRA: gpu
    entrypoint: ["lecture-process"]
    # Your host user, so files written to data/ stay yours (set by the Makefile).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - path: ../.env
        required: false
    environment:
      WHISPER_DEVICE: cuda
    volumes:
      - ../data:/app/data
      - ../prompts:/app/prompts:ro
    deploy: *gpu

  # Observability (`make observability`): Grafana on http://localhost:3001 with Tempo (traces),
  # Prometheus (metrics) and Loki (logs), fed over OpenTelemetry. With OTEL_ENDPOINT in .env
  # (http://otel-lgtm:4318), the API and workers send their telemetry here.
  otel-lgtm:
    image: grafana/otel-lgtm:0.33.1
    profiles: [observability]
    ports:
      - "127.0.0.1:3001:3000"  # Grafana
      - "127.0.0.1:4318:4318"  # OTLP over HTTP, for processes run on the host
    environment:
      # Traffic here is sparse, so the dashboard needs exact counts. A zero sample at each series'
      # start lets increase() see its first event, and `anchored` ranges don't extrapolate.
      PROMETHEUS_EXTRA_ARGS: >-
        --enable-feature=created-timestamp-zero-ingestion,promql-extended-range-selectors
    volumes:
      - otel-lgtm-data:/data
      - ./grafana/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/lecture.yaml:ro
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/lecture.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/lecture-dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  seaweedfs-data:
  temporal-home:
  qdrant-data:
  tei-data:
  otel-lgtm-data:
