[project]
name = "lecture-api"
version = "0.1.0"
description = "FastAPI service: uploads, processing, results, search and Q&A."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "httpx>=0.28",
    "lecture-core",
    "lecture-llm",
    "lecture-rag",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "pydantic-ai-slim[google]>=2.51",
    "pyjwt[crypto]>=2.10",
    "qdrant-client>=1.19.1",
    "temporalio>=1.33",
    "uvicorn[standard]>=0.54",
]

[tool.uv.sources]
lecture-core = { workspace = true }
lecture-llm = { workspace = true }
lecture-rag = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
